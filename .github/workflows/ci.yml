name: Continuous integration

on:
  workflow_call:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

# Read access is the workflow default. Only the release job receives write access.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    name: Resolve release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.identity.outputs.channel }}
      tag: ${{ steps.identity.outputs.tag }}
      build_version: ${{ steps.identity.outputs.build_version }}

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve branch identity
        id: identity
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: |
          set -Eeuo pipefail
          case "$TARGET_BRANCH" in
            dev)
              channel=dev
              tag="${GITHUB_SHA:0:7}"
              build_version="dev_$tag"
              ;;
            main)
              channel=main
              tag="$(python3 -c 'import json; print(json.load(open("release-config.json", encoding="utf-8"))["mainRelease"]["version"])')"
              build_version="$tag"
              ;;
            *)
              printf 'Unsupported release branch: %s\n' "$TARGET_BRANCH" >&2
              exit 1
              ;;
          esac
          {
            printf 'channel=%s\n' "$channel"
            printf 'tag=%s\n' "$tag"
            printf 'build_version=%s\n' "$build_version"
          } >> "$GITHUB_OUTPUT"
          printf 'Channel: %s; tag: %s; WPF version: %s\n' \
            "$channel" "$tag" "$build_version" >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Python tests and source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          version: "0.9.8"
          enable-cache: true
          cache-dependency-glob: auto_tests/uv.lock

      - name: Synchronize locked test environment
        working-directory: auto_tests
        run: uv sync --frozen --extra dev

      - name: Lint Python
        working-directory: auto_tests
        run: >-
          uv run --frozen python -m ruff check
          app tests tools ../assets/live/*.py ../iso-tools/*.py ../grub/*.py

      - name: Check Python formatting
        working-directory: auto_tests
        run: >-
          uv run --frozen python -m ruff format --check
          app tests tools ../assets/live/*.py ../iso-tools/*.py ../grub/*.py

      - name: Run Python test suite with coverage
        working-directory: auto_tests
        run: uv run --frozen python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Validate shell script syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(git ls-files -z '*.sh')

      - name: Run ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck -x -S warning

      - name: Validate versioned JSON contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          uv run --project auto_tests --frozen python -m json.tool schemas/installation-plan.schema.json >/dev/null
          uv run --project auto_tests --frozen python -m json.tool schemas/installation-state.schema.json >/dev/null
          uv run --project auto_tests --frozen python -m json.tool schemas/release-config.schema.json >/dev/null
          uv run --project auto_tests --frozen python -m json.tool release-config.json >/dev/null

  wpf:
    name: Build WPF (.NET Framework 4.8)
    needs:
      - identity
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Add Visual Studio MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          vs-version: "[17.0,18.0)"

      - name: Verify .NET Framework 4.8 build tools
        shell: pwsh
        run: |
          $referenceAssemblies = Join-Path ${env:ProgramFiles(x86)} `
            'Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8'
          if (-not (Test-Path -LiteralPath $referenceAssemblies -PathType Container)) {
            throw ".NET Framework 4.8 targeting pack is missing: $referenceAssemblies"
          }
          msbuild -version

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failures = [System.Collections.Generic.List[string]]::new()
          Get-ChildItem -Path Scripts, auto_tests/app/scripts, PowerShell.Tests -Recurse -File |
            Where-Object { $_.Extension -in '.ps1', '.psm1' } |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName,
                [ref]$tokens,
                [ref]$errors
              )
              foreach ($errorRecord in $errors) {
                $failures.Add("$($_.FullName): $($errorRecord.Message)")
              }
            }
          if ($failures.Count -gt 0) {
            throw ($failures -join [Environment]::NewLine)
          }

      - name: Analyze PowerShell
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 `
            -Scope CurrentUser -Force -Repository PSGallery
          $findings = @(
            Invoke-ScriptAnalyzer `
              -Path Scripts `
              -Recurse `
              -Settings PSScriptAnalyzerSettings.psd1 `
              -Severity Error, Warning
            Invoke-ScriptAnalyzer `
              -Path auto_tests/app/scripts `
              -Recurse `
              -Settings PSScriptAnalyzerSettings.psd1 `
              -Severity Error, Warning
            Invoke-ScriptAnalyzer `
              -Path PowerShell.Tests `
              -Recurse `
              -Settings PSScriptAnalyzerSettings.psd1 `
              -Severity Error, Warning
          )
          $findings | Format-Table -AutoSize
          if ($findings.Count -gt 0) {
            throw "PSScriptAnalyzer reported $($findings.Count) finding(s)."
          }

      - name: Run PowerShell contract tests
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 6.0.1 `
            -Scope CurrentUser -Force -Repository PSGallery
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = 'PowerShell.Tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $configuration

      - name: Stamp source revision in the executable
        shell: pwsh
        env:
          LIBERTIX_BUILD_VERSION: ${{ needs.identity.outputs.build_version }}
        run: |
          $path = 'Properties\AssemblyInfo.cs'
          $content = [IO.File]::ReadAllText($path)
          $stamped = $content.Replace(
            'AssemblyInformationalVersion("dev_0000000")',
            "AssemblyInformationalVersion(`"$env:LIBERTIX_BUILD_VERSION`")"
          )
          if ($stamped -eq $content) {
            throw 'Assembly informational version placeholder was not found.'
          }
          [IO.File]::WriteAllText(
            $path,
            $stamped,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Build Libertix.exe
        shell: pwsh
        run: >-
          msbuild Libertix.sln
          /restore
          /m
          /warnaserror
          /p:Configuration=Release
          '/p:Platform=Any CPU'
          /verbosity:minimal

      - name: Run C# contract tests
        shell: pwsh
        run: >-
          dotnet test Libertix.Tests\Libertix.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --verbosity minimal

      - name: Verify WPF output
        shell: pwsh
        env:
          LIBERTIX_BUILD_VERSION: ${{ needs.identity.outputs.build_version }}
        run: |
          $outputDirectory = 'bin\Release'
          $executable = Join-Path $outputDirectory 'Libertix.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Expected WPF executable was not produced: $executable"
          }
          Copy-Item -LiteralPath LICENSE, THIRD_PARTY.md -Destination $outputDirectory
          @(
            "source-revision=$env:GITHUB_SHA"
            "source-ref=$env:GITHUB_REF"
            "workflow-run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "informational-version=$env:LIBERTIX_BUILD_VERSION"
          ) | Set-Content -LiteralPath (Join-Path $outputDirectory 'BUILD-INFO.txt') -Encoding utf8
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $executable
          "Libertix.exe SHA-256: $($hash.Hash.ToLowerInvariant())" |
            Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload WPF build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Libertix-wpf-${{ github.sha }}
          path: bin/Release/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  iso:
    name: Build and verify BIOS and UEFI mini-ISO
    needs:
      - quality
      - wpf
    # The ISO builder requires a privileged Docker container. Do not execute
    # untrusted pull-request code with that privilege.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify Docker and disk capacity
        shell: bash
        run: |
          set -Eeuo pipefail
          docker version
          available_bytes="$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -n 1 | tr -d ' ')"
          required_bytes="$((12 * 1024 * 1024 * 1024))"
          printf 'Available workspace capacity: %s bytes\n' "$available_bytes"
          if (( available_bytes < required_bytes )); then
            printf 'At least %s bytes are required for both full ISO builds.\n' \
              "$required_bytes" >&2
            exit 1
          fi

      - name: Build and verify both mini-ISO images
        shell: bash
        run: ./iso-tools/build-isos-docker.sh all

      - name: Record ISO checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s libertix-installer-bios.iso
          test -s libertix-installer-uefi.iso
          sha256sum \
            libertix-installer-bios.iso \
            libertix-installer-uefi.iso \
            | tee libertix-isos.sha256
          cat libertix-isos.sha256 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified mini-ISO images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Libertix-mini-isos-${{ github.sha }}
          path: |
            libertix-installer-bios.iso
            libertix-installer-uefi.iso
            libertix-isos.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish channel release and signed metadata
    needs:
      - identity
      - quality
      - wpf
      - iso
    if: >-
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          version: "0.9.8"
          enable-cache: true
          cache-dependency-glob: auto_tests/uv.lock

      - name: Synchronize locked metadata environment
        working-directory: auto_tests
        run: uv sync --frozen --extra dev

      - name: Download WPF build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Libertix-wpf-${{ github.sha }}
          path: release-input/wpf

      - name: Download verified mini-ISO images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Libertix-mini-isos-${{ github.sha }}
          path: release-input/iso

      - name: Prepare release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d release-input/wpf
          test -s release-input/iso/libertix-installer-bios.iso
          test -s release-input/iso/libertix-installer-uefi.iso
          mkdir -p release-assets
          (
            cd release-input/wpf
            zip -9 -q -r "$GITHUB_WORKSPACE/release-assets/Libertix-wpf.zip" .
          )
          cp -- \
            release-input/iso/libertix-installer-bios.iso \
            release-input/iso/libertix-installer-uefi.iso \
            release-assets/
          uv run --project auto_tests --frozen python iso-tools/prepare-support-artifacts.py \
            --catalog Scripts/config/Libertix.Artifacts.json \
            --source-dir auto_tests/app/filepool \
            --output-dir release-assets
          test -s release-assets/Libertix-wpf.zip

      - name: Generate and sign channel metadata
        shell: bash
        env:
          LIBERTIX_SIGNING_PRIVATE_KEY: ${{ secrets.LIBERTIX_SIGNING_PRIVATE_KEY }}
          RELEASE_CHANNEL: ${{ needs.identity.outputs.channel }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          set -Eeuo pipefail
          test -n "$LIBERTIX_SIGNING_PRIVATE_KEY" || {
            printf 'Required Actions secret LIBERTIX_SIGNING_PRIVATE_KEY is missing.\n' >&2
            exit 1
          }
          install -d -m 0700 release-work
          printf '%s\n' "$LIBERTIX_SIGNING_PRIVATE_KEY" > release-work/signing-private.pem
          chmod 0600 release-work/signing-private.pem
          uv run --project auto_tests --frozen python iso-tools/generate-release-metadata.py \
            --channel "$RELEASE_CHANNEL" \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --bios-iso release-assets/libertix-installer-bios.iso \
            --uefi-iso release-assets/libertix-installer-uefi.iso \
            --wpf-zip release-assets/Libertix-wpf.zip \
            --aria2-archive release-assets/aria2-64.zip \
            --ext4-driver release-assets/ext4-win-driver.exe \
            --grub4dos-loader release-assets/grldr \
            --grub4dos-mbr release-assets/grldr.mbr \
            --output-dir release-metadata
          uv run --project auto_tests --frozen python iso-tools/sign-release-metadata.py \
            --private-key release-work/signing-private.pem \
            release-metadata/catalog.json \
            release-metadata/releases.json
          test -s release-metadata/catalog.json.sig
          test -s release-metadata/releases.json.sig
          cp -- \
            release-assets/aria2-64.zip \
            release-assets/ext4-win-driver.exe \
            release-assets/grldr \
            release-assets/grldr.mbr \
            release-metadata/

      - name: Validate an existing stable version
        if: needs.identity.outputs.channel == 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if tag_sha="$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null)"; then
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              printf 'Stable version %s already points to a different commit. Update mainRelease.version in release-config.json.\n' \
                "$RELEASE_TAG" >&2
              exit 1
            fi
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ needs.identity.outputs.channel }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          set -Eeuo pipefail
          title="$(jq -r '.latest.title' release-metadata/releases.json)"
          notes="$(jq -r '.latest.notes' release-metadata/releases.json)"
          assets=(
            release-assets/Libertix-wpf.zip
            release-assets/libertix-installer-bios.iso
            release-assets/libertix-installer-uefi.iso
          )
          if [ "$RELEASE_CHANNEL" = dev ] && gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          elif [ "$RELEASE_CHANNEL" = dev ]; then
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          elif gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --latest
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --latest
          fi

      - name: Keep the three newest dev alpha prereleases
        if: needs.identity.outputs.channel == 'dev'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          mapfile -t stale_tags < <(
            gh release list \
              --limit 100 \
              --json tagName,isPrerelease,createdAt \
              --jq '[.[] | select(.isPrerelease == true and (.tagName | test("^[0-9a-f]{7}$")))] | sort_by(.createdAt) | reverse | .[3:][] | .tagName'
          )
          for stale_tag in "${stale_tags[@]}"; do
            gh release delete "$stale_tag" --cleanup-tag --yes
          done

      - name: Upload signed Pages payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Libertix-pages-${{ needs.identity.outputs.channel }}-${{ github.sha }}
          path: |
            release-metadata/aria2-64.zip
            release-metadata/catalog.json
            release-metadata/catalog.json.sig
            release-metadata/ext4-win-driver.exe
            release-metadata/grldr
            release-metadata/grldr.mbr
            release-metadata/releases.json
            release-metadata/releases.json.sig
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  pages:
    name: Publish ${{ needs.identity.outputs.channel }} metadata to GitHub Pages
    needs:
      - identity
      - release
    if: >-
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: libertix-pages-publication
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write

    steps:
      - name: Check out Pages branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: gh-pages
          fetch-depth: 0
          path: pages-branch

      - name: Download signed channel payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Libertix-pages-${{ needs.identity.outputs.channel }}-${{ github.sha }}
          path: generated-metadata

      - name: Commit only the selected channel
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ needs.identity.outputs.channel }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          set -Eeuo pipefail
          case "$RELEASE_CHANNEL" in
            dev|main) ;;
            *) printf 'Invalid Pages channel: %s\n' "$RELEASE_CHANNEL" >&2; exit 1 ;;
          esac
          channel_files=(
            aria2-64.zip
            catalog.json
            catalog.json.sig
            ext4-win-driver.exe
            grldr
            grldr.mbr
            releases.json
            releases.json.sig
          )
          for filename in "${channel_files[@]}"; do
            test -s "generated-metadata/$filename"
          done
          install -d -m 0755 "pages-branch/$RELEASE_CHANNEL"
          for filename in "${channel_files[@]}"; do
            install -m 0644 "generated-metadata/$filename" \
              "pages-branch/$RELEASE_CHANNEL/$filename"
          done
          touch pages-branch/.nojekyll
          git -C pages-branch config user.name "felix068"
          git -C pages-branch config user.email "77407722+felix068@users.noreply.github.com"
          git -C pages-branch add -- .nojekyll "$RELEASE_CHANNEL"
          if ! git -C pages-branch diff --cached --quiet; then
            git -C pages-branch commit \
              -m "Publish $RELEASE_CHANNEL artifacts for $RELEASE_TAG"
          fi

      - name: Push Pages branch with conflict retry
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3; do
            git -C pages-branch pull --rebase origin gh-pages
            if git -C pages-branch push origin HEAD:gh-pages; then
              exit 0
            fi
            printf 'Pages push attempt %s failed; retrying after synchronization.\n' "$attempt" >&2
          done
          printf 'Pages branch could not be published after three attempts.\n' >&2
          exit 1

      - name: Request GitHub Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_CHANNEL: ${{ needs.identity.outputs.channel }}
        run: |
          set -Eeuo pipefail
          pages_commit="$(git -C pages-branch rev-parse HEAD)"
          build_url="$(gh api --method POST "repos/$GH_REPO/pages/builds" --jq '.url')"
          for attempt in $(seq 1 60); do
            build="$(gh api "$build_url")"
            status="$(jq -r '.status' <<<"$build")"
            commit="$(jq -r '.commit // ""' <<<"$build")"
            if [ "$status" = built ] && [ "$commit" = "$pages_commit" ]; then
              break
            fi
            if [ "$status" = errored ] && [ "$commit" = "$pages_commit" ]; then
              jq -r '.error.message // "GitHub Pages build failed."' <<<"$build" >&2
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              printf 'GitHub Pages did not publish commit %s within five minutes.\n' \
                "$pages_commit" >&2
              exit 1
            fi
            sleep 5
          done

          mkdir -p .work/pages-verification
          channel_files=(
            aria2-64.zip
            catalog.json
            catalog.json.sig
            ext4-win-driver.exe
            grldr
            grldr.mbr
            releases.json
            releases.json.sig
          )
          for filename in "${channel_files[@]}"; do
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors \
              "https://ekimiateam.github.io/libertix/$RELEASE_CHANNEL/$filename?commit=$pages_commit" \
              --output ".work/pages-verification/$filename"
            cmp -- "generated-metadata/$filename" ".work/pages-verification/$filename"
          done
